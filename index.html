<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Мама Трекер</title>
    <style>
        :root {
            --bg: #1a1a2e;
            --surface: #16213e;
            --accent: #e8a0bf;
            --accent-dark: #d4899f;
            --text: #f0e6ef;
            --text-secondary: #a8a0b0;
            --success: #7ecb8a;
            --left-breast: #e8a0bf;
            --right-breast: #a0c4e8;
            --sleep: #c4a0e8;
            --diaper: #a0e8c4;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: env(safe-area-inset-top, 20px) 20px env(safe-area-inset-bottom, 20px);
            max-width: 500px;
            margin: 0 auto;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .header { text-align: center; padding: 20px 0 10px; }
        .header h1 { font-size: 28px; font-weight: 700; margin-bottom: 4px; }
        .header .date { color: var(--text-secondary); font-size: 14px; }

        /* Вкладки */
        .tabs {
            display: flex;
            gap: 8px;
            margin: 16px 0;
        }
        .tab-btn {
            flex: 1;
            height: 50px;
            border-radius: 16px;
            border: none;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            background: var(--surface);
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .tab-btn.active {
            background: var(--accent);
            color: #1a1a2e;
            transform: scale(1.03);
        }
        .tab-btn:active { transform: scale(0.95); }

        /* Контент вкладок */
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .card {
            background: var(--surface);
            border-radius: 24px;
            padding: 24px;
            margin: 16px 0;
        }
        .card-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .timer-display {
            text-align: center;
            font-size: 64px;
            font-weight: 300;
            font-family: 'SF Mono', 'Menlo', 'Courier New', monospace;
            margin: 16px 0 24px;
            letter-spacing: 2px;
        }
        .breast-select { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
        .breast-btn {
            height: 64px;
            border-radius: 20px;
            border: 2px solid transparent;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .breast-btn.left { background: rgba(232,160,191,0.15); color: var(--left-breast); }
        .breast-btn.right { background: rgba(160,196,232,0.15); color: var(--right-breast); }
        .breast-btn.selected { border-color: currentColor; }
        .breast-btn.left.selected { background: rgba(232,160,191,0.3); border-color: var(--left-breast); }
        .breast-btn.right.selected { background: rgba(160,196,232,0.3); border-color: var(--right-breast); }
        .action-btn {
            width: 100%;
            height: 60px;
            border-radius: 20px;
            border: none;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 8px;
        }
        .action-btn.start { background: var(--accent); color: #1a1a2e; }
        .action-btn.stop { background: #e8606e; color: white; }
        .action-btn.start-sleep { background: var(--sleep); color: #1a1a2e; }
        .action-btn:active { transform: scale(0.97); }
        .action-btn:disabled { opacity: 0.4; pointer-events: none; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .stat-item { background: rgba(255,255,255,0.03); border-radius: 16px; padding: 16px; text-align: center; }
        .stat-value { font-size: 28px; font-weight: 700; color: var(--accent); }
        .stat-label { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }

        /* Типы подгузников */
        .diaper-types { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
        .diaper-btn {
            height: 80px;
            border-radius: 20px;
            border: 2px solid transparent;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background: rgba(160,232,196,0.1);
            color: var(--diaper);
        }
        .diaper-btn.wet { background: rgba(160,196,232,0.1); color: #a0c4e8; }
        .diaper-btn.dirty { background: rgba(200,180,140,0.1); color: #c8b48c; }
        .diaper-btn.both { background: rgba(232,160,191,0.1); color: #e8a0bf; }
        .diaper-btn.selected { border-color: currentColor; }

        .history-list { max-height: 300px; overflow-y: auto; }
        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .history-item:last-child { border-bottom: none; }
        .history-duration { font-weight: 600; font-size: 15px; }
        .history-side { font-size: 12px; color: var(--text-secondary); }
        .side-dot {
            display: inline-block;
            width: 8px; height: 8px;
            border-radius: 50%;
            margin-right: 4px;
        }
        .side-dot.left { background: var(--left-breast); }
        .side-dot.right { background: var(--right-breast); }
        .side-dot.sleep { background: var(--sleep); }
        .side-dot.wet { background: #a0c4e8; }
        .side-dot.dirty { background: #c8b48c; }
        .side-dot.both { background: #e8a0bf; }
        .empty-state { text-align: center; color: var(--text-secondary); padding: 30px; font-size: 14px; }
        .reminder-btn {
            flex: 1;
            height: 44px;
            border-radius: 14px;
            border: none;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
        .reminder-btn:active { transform: scale(0.95); }

        ::-webkit-scrollbar { width: 3px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
    </style>
</head>
<body>

    <div class="header">
        <h1>🤱 Мама Трекер</h1>
        <div class="date" id="todayDate"></div>
    </div>

    <!-- Вкладки -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('feeding')">🍼 Кормление</button>
        <button class="tab-btn" onclick="switchTab('sleep')">😴 Сон</button>
        <button class="tab-btn" onclick="switchTab('diaper')">💧 Подгузники</button>
    </div>

    <!-- === ВКЛАДКА: КОРМЛЕНИЕ === -->
    <div class="tab-content active" id="tab-feeding">
        <div class="card">
            <div class="card-title">🍼 Кормление</div>
            <div class="breast-select">
                <button class="breast-btn left" id="btnLeft" onclick="selectSide('left')">⬅️ Левая</button>
                <button class="breast-btn right" id="btnRight" onclick="selectSide('right')">➡️ Правая</button>
            </div>
            <div class="timer-display" id="feedingTimer">00:00</div>
            <button class="action-btn start" id="feedingBtn" onclick="feedingToggle()" disabled>▶️ Начать</button>
        </div>
        <div class="card">
            <div class="card-title">📊 Сегодня</div>
            <div class="stats-grid">
                <div class="stat-item"><div class="stat-value" id="feedCount">0</div><div class="stat-label">Кормлений</div></div>
                <div class="stat-item"><div class="stat-value" id="feedDuration">0 мин</div><div class="stat-label">Общее время</div></div>
            </div>
            <div id="reminderStatus" style="text-align:center; font-size:13px; margin-top:16px; min-height:20px;"></div>
            <div style="display:flex; gap:8px; margin-top:12px;">
                <button onclick="startReminder(120)" class="reminder-btn" style="background:rgba(232,160,191,0.2); color:#e8a0bf;">🔔 2 ч</button>
                <button onclick="startReminder(180)" class="reminder-btn" style="background:rgba(160,196,232,0.2); color:#a0c4e8;">🔔 3 ч</button>
                <button onclick="stopReminder()" class="reminder-btn" style="background:rgba(255,255,255,0.05); color:#a8a0b0;">🔕</button>
            </div>
        </div>
        <div class="card">
            <div class="card-title">📝 История</div>
            <div class="history-list" id="feedHistory"><div class="empty-state">Нет записей</div></div>
        </div>
    </div>

    <!-- === ВКЛАДКА: СОН === -->
    <div class="tab-content" id="tab-sleep">
        <div class="card">
            <div class="card-title">😴 Сон</div>
            <div class="timer-display" id="sleepTimer">00:00</div>
            <button class="action-btn start-sleep" id="sleepBtn" onclick="sleepToggle()">▶️ Уложить спать</button>
        </div>
        <div class="card">
            <div class="card-title">📊 Сегодня</div>
            <div class="stats-grid">
                <div class="stat-item"><div class="stat-value" id="sleepCount">0</div><div class="stat-label">Снов</div></div>
                <div class="stat-item"><div class="stat-value" id="sleepDuration">0 мин</div><div class="stat-label">Общее время</div></div>
            </div>
        </div>
        <div class="card">
            <div class="card-title">📝 История</div>
            <div class="history-list" id="sleepHistory"><div class="empty-state">Нет записей</div></div>
        </div>
    </div>

    <!-- === ВКЛАДКА: ПОДГУЗНИКИ === -->
    <div class="tab-content" id="tab-diaper">
        <div class="card">
            <div class="card-title">💧 Сменить подгузник</div>
            <div class="diaper-types">
                <button class="diaper-btn wet" onclick="addDiaper('wet')">💦<br>Мокрый</button>
                <button class="diaper-btn dirty" onclick="addDiaper('dirty')">💩<br>Грязный</button>
                <button class="diaper-btn both" onclick="addDiaper('both')">💦💩<br>Всё вместе</button>
                <button class="diaper-btn" onclick="addDiaper('dry')">✅<br>Просто сменили</button>
            </div>
        </div>
        <div class="card">
            <div class="card-title">📊 Сегодня</div>
            <div class="stats-grid">
                <div class="stat-item"><div class="stat-value" id="diaperCount">0</div><div class="stat-label">Всего смен</div></div>
                <div class="stat-item"><div class="stat-value" id="diaperDirty">0</div><div class="stat-label">Грязных</div></div>
            </div>
        </div>
        <div class="card">
            <div class="card-title">📝 История</div>
            <div class="history-list" id="diaperHistory"><div class="empty-state">Нет записей</div></div>
        </div>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        // === TELEGRAM ===
        const tg = window.Telegram?.WebApp;
        if (tg) { tg.ready(); tg.expand(); }

        const today = new Date();
        document.getElementById('todayDate').textContent = today.toLocaleDateString('ru-RU', {
            weekday: 'long', day: 'numeric', month: 'long'
        });

        // === ВКЛАДКИ ===
        let currentTab = 'feeding';

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach((b, i) => {
                b.classList.toggle('active', ['feeding','sleep','diaper'][i] === tab);
            });
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.getElementById('tab-' + tab).classList.add('active');
        }

        // === ХРАНИЛИЩЕ ===
        function getKey(type) {
            return 'mama-' + type + '-' + today.toISOString().split('T')[0];
        }

        function getRecords(type) {
            return JSON.parse(localStorage.getItem(getKey(type)) || '[]');
        }

        function saveRecord(type, data) {
            const key = getKey(type);
            const records = JSON.parse(localStorage.getItem(key) || '[]');
            records.push({ ...data, timestamp: Date.now() });
            localStorage.setItem(key, JSON.stringify(records));
        }

        // === КОРМЛЕНИЕ ===
        let feedSide = null;
        let feedRunning = false;
        let feedStart = null;
        let feedInterval = null;

        function selectSide(side) {
            if (feedRunning) return;
            feedSide = side;
            document.getElementById('btnLeft').classList.toggle('selected', side === 'left');
            document.getElementById('btnRight').classList.toggle('selected', side === 'right');
            document.getElementById('feedingBtn').disabled = false;
        }

        function feedingToggle() {
            if (feedRunning) stopFeeding(); else startFeeding();
        }

        function startFeeding() {
            if (!feedSide) return;
            feedRunning = true;
            feedStart = Date.now();
            document.getElementById('feedingBtn').textContent = '⏹ Завершить';
            document.getElementById('feedingBtn').className = 'action-btn stop';
            document.getElementById('btnLeft').style.opacity = '0.5';
            document.getElementById('btnRight').style.opacity = '0.5';
            feedInterval = setInterval(() => {
                const e = Math.floor((Date.now() - feedStart) / 1000);
                document.getElementById('feedingTimer').textContent =
                    String(Math.floor(e/60)).padStart(2,'0') + ':' + String(e%60).padStart(2,'0');
            }, 200);
        }

        function stopFeeding() {
            feedRunning = false;
            clearInterval(feedInterval);
            const dur = Math.floor((Date.now() - feedStart) / 1000);
            document.getElementById('feedingTimer').textContent = '00:00';
            document.getElementById('feedingBtn').textContent = '▶️ Начать';
            document.getElementById('feedingBtn').className = 'action-btn start';
            document.getElementById('feedingBtn').disabled = true;
            document.getElementById('btnLeft').style.opacity = '1';
            document.getElementById('btnRight').style.opacity = '1';
            document.getElementById('btnLeft').classList.remove('selected');
            document.getElementById('btnRight').classList.remove('selected');
            if (dur >= 30) {
                saveRecord('feed', { side: feedSide, duration: dur });
                updateFeedStats();
                renderFeedHistory();
            }
        }

        function updateFeedStats() {
            const recs = getRecords('feed');
            document.getElementById('feedCount').textContent = recs.length;
            const min = Math.floor(recs.reduce((s,r) => s + r.duration, 0) / 60);
            document.getElementById('feedDuration').textContent = min < 60 ? min + ' мин' : Math.floor(min/60) + ' ч ' + (min%60) + ' мин';
        }

        function renderFeedHistory() {
            const recs = getRecords('feed').sort((a,b) => b.timestamp - a.timestamp);
            const list = document.getElementById('feedHistory');
            if (!recs.length) { list.innerHTML = '<div class="empty-state">Нет записей</div>'; return; }
            list.innerHTML = recs.map(r => {
                const t = new Date(r.timestamp).toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'});
                const min = Math.floor(r.duration/60);
                const sec = r.duration%60;
                return `<div class="history-item">
                    <span>${t}</span>
                    <span class="history-duration">${min}:${String(sec).padStart(2,'0')}</span>
                    <span class="history-side"><span class="side-dot ${r.side}"></span>${r.side==='left'?'Левая':'Правая'}</span>
                </div>`;
            }).join('');
        }

        // === СОН ===
        let sleepRunning = false;
        let sleepStart = null;
        let sleepInterval = null;

        function sleepToggle() {
            if (sleepRunning) stopSleep(); else startSleep();
        }

        function startSleep() {
            sleepRunning = true;
            sleepStart = Date.now();
            document.getElementById('sleepBtn').textContent = '⏹ Проснулся';
            document.getElementById('sleepBtn').className = 'action-btn stop';
            sleepInterval = setInterval(() => {
                const e = Math.floor((Date.now() - sleepStart) / 1000);
                document.getElementById('sleepTimer').textContent =
                    String(Math.floor(e/60)).padStart(2,'0') + ':' + String(e%60).padStart(2,'0');
            }, 200);
        }

        function stopSleep() {
            sleepRunning = false;
            clearInterval(sleepInterval);
            const dur = Math.floor((Date.now() - sleepStart) / 1000);
            document.getElementById('sleepTimer').textContent = '00:00';
            document.getElementById('sleepBtn').textContent = '▶️ Уложить спать';
            document.getElementById('sleepBtn').className = 'action-btn start-sleep';
            if (dur >= 60) {
                saveRecord('sleep', { duration: dur });
                updateSleepStats();
                renderSleepHistory();
            }
        }

        function updateSleepStats() {
            const recs = getRecords('sleep');
            document.getElementById('sleepCount').textContent = recs.length;
            const min = Math.floor(recs.reduce((s,r) => s + r.duration, 0) / 60);
            document.getElementById('sleepDuration').textContent = min < 60 ? min + ' мин' : Math.floor(min/60) + ' ч ' + (min%60) + ' мин';
        }

        function renderSleepHistory() {
            const recs = getRecords('sleep').sort((a,b) => b.timestamp - a.timestamp);
            const list = document.getElementById('sleepHistory');
            if (!recs.length) { list.innerHTML = '<div class="empty-state">Нет записей</div>'; return; }
            list.innerHTML = recs.map(r => {
                const t = new Date(r.timestamp).toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'});
                const min = Math.floor(r.duration/60);
                const h = Math.floor(min/60);
                const durStr = h > 0 ? h + ' ч ' + (min%60) + ' мин' : min + ' мин';
                return `<div class="history-item">
                    <span>${t}</span>
                    <span class="history-duration">${durStr}</span>
                    <span class="history-side"><span class="side-dot sleep"></span>Сон</span>
                </div>`;
            }).join('');
        }

        // === ПОДГУЗНИКИ ===
        function addDiaper(type) {
            saveRecord('diaper', { type: type });
            updateDiaperStats();
            renderDiaperHistory();
            if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
        }

        function updateDiaperStats() {
            const recs = getRecords('diaper');
            document.getElementById('diaperCount').textContent = recs.length;
            document.getElementById('diaperDirty').textContent = recs.filter(r => r.type === 'dirty' || r.type === 'both').length;
        }

        function renderDiaperHistory() {
            const recs = getRecords('diaper').sort((a,b) => b.timestamp - a.timestamp);
            const list = document.getElementById('diaperHistory');
            if (!recs.length) { list.innerHTML = '<div class="empty-state">Нет записей</div>'; return; }
            const labels = { wet: '💦 Мокрый', dirty: '💩 Грязный', both: '💦💩 Всё вместе', dry: '✅ Сменили' };
            const dots = { wet: 'wet', dirty: 'dirty', both: 'both', dry: 'sleep' };
            list.innerHTML = recs.map(r => {
                const t = new Date(r.timestamp).toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'});
                return `<div class="history-item">
                    <span>${t}</span>
                    <span class="history-side"><span class="side-dot ${dots[r.type]}"></span>${labels[r.type]}</span>
                </div>`;
            }).join('');
        }

        // === НАПОМИНАНИЯ (кормление) ===
        let reminderInterval = null;
        let reminderMinutes = null;

        function getMinutesSinceLastFeeding() {
            const recs = getRecords('feed');
            if (!recs.length) return null;
            return Math.floor((Date.now() - recs[recs.length-1].timestamp) / 60000);
        }

        function startReminder(min) {
            stopReminder();
            if ('Notification' in window && Notification.permission === 'default') {
                Notification.requestPermission().then(p => { if (p === 'granted') startReminder(min); });
                return;
            }
            reminderMinutes = min;
            reminderInterval = setInterval(() => {
                const m = getMinutesSinceLastFeeding();
                if (m !== null && m >= reminderMinutes && 'Notification' in window && Notification.permission === 'granted') {
                    new Notification('🍼 Время кормления!', {
                        body: 'Прошло ' + m + ' минут с последнего кормления',
                        tag: 'feed-reminder',
                        vibrate: [200,100,200]
                    });
                    stopReminder();
                }
            }, 30000);
        }

        function stopReminder() {
            if (reminderInterval) { clearInterval(reminderInterval); reminderInterval = null; }
            reminderMinutes = null;
        }

        // === ИНИЦИАЛИЗАЦИЯ ===
        updateFeedStats();
        renderFeedHistory();
        updateSleepStats();
        renderSleepHistory();
        updateDiaperStats();
        renderDiaperHistory();
    </script>
</body>
</html>
